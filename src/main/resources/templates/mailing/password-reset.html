<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Melodi — reset password</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<h2>Reset your password</h2>
<p>Hi <span th:text="${fullName}">there</span>,</p>
<p>Use this link in Postman (POST with your new password in the body):</p>
<p th:text="${resetURL}"></p>
<p>Example body: <code>{ "password": "newpass123" }</code></p>
</body>
</html>
