<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Melodi — password changed</title>
</head>
<body style="margin:0;padding:24px;background:#0a0a0a;font-family:Arial,Helvetica,sans-serif;color:#fafafa;line-height:1.6;">
<div style="max-width:520px;margin:0 auto;background:#141414;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:28px;">
    <p style="margin:0 0 4px 0;font-size:12px;letter-spacing:0.15em;text-transform:uppercase;color:#a3a3a3;">Melodi Instruments</p>
    <h2 style="margin:0 0 16px 0;font-size:22px;font-weight:600;color:#fafafa;">Password changed</h2>
    <p style="margin:0 0 12px 0;color:#d4d4d4;">Hi <span th:text="${fullName}">there</span>,</p>
    <p style="margin:0 0 20px 0;color:#d4d4d4;">Your Melodi password was changed successfully.</p>
    <p style="margin:0 0 20px 0;">
        <a th:href="${signInURL}" style="display:inline-block;background:#fafafa;color:#0a0a0a;text-decoration:none;font-weight:600;padding:12px 18px;border-radius:8px;">Sign in</a>
    </p>
    <p style="margin:0;font-size:13px;color:#f87171;">If you did not make this change, secure your account right away.</p>
</div>
</body>
</html>
